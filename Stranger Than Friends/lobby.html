<style>

.icons-lobby {

  display: flex;
  justify-content: center;
  gap: 10px;

.icons-lobby:hover {

.icons-lobby a:not(:first-child) {
  margin-left: -45px;   
}

.icons-lobby a:nth-child(1) { z-index: 1; }
.icons-lobby a:nth-child(2) { z-index: 2; }
.icons-lobby a:nth-child(3) { z-index: 3; }
.icons-lobby a:nth-child(4) { z-index: 4; }
.icons-lobby a:nth-child(5) { z-index: 5; }

  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
