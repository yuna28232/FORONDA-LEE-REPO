<!DOCTYPE html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranger Than Friends</title>
  <script src="../js-files/pnp-musicplayer.js" defer></script>
  <link rel="icon" href="../assets2/other/favicon.ico">
  
  <style>

    body {
        background-color: rgb(0, 0, 0);
        background-image: url(../assets2/bgs/rainbowstars.gif);
        background-size: auto;
        background-repeat: repeat;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        color: white;
        font-family: 'Courier New', Courier, monospace;
        min-height: 100vh;
    }


    .audio-player {
        position: fixed;
        bottom: 20px; 
        right: 0;
        width: 50px;
        height: 450px !important;
    background-color: rgb(160, 239, 203) !important; 
    background: linear-gradient(
        180deg,
        rgba(183, 244, 2116, 1) 0%, 
        rgb(89, 224, 177) 100%
    ) !important;
    box-shadow: 0 0 20px rgba(84, 221, 173, 0.5); 
        overflow: hidden;
        transition: all 0.3s ease;
        color: rgb(48, 133, 109);
        z-index: 999999;
        border-radius: 15px 0 0 15px;
    }
  
    .audio-player.open {
        width: 90vw; 
    }

   @media screen and (min-width: 1024px) {
    .audio-player {
  
        bottom: auto;
        top: 450px;
        transform: translateY(-50%);
        height: 500px;
        z-index: 99999;
    }

    .audio-player.open {
        width: 320px; 
        z-index: 99999;
    }
}


    .toggle {
        width: 50px;
        height: 50px;
        border: none;
        background: none;
        color: white;
        font-size: 22px;
        cursor: pointer;
    }

    .player-content {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 12px;
        gap: 6px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
    }

    .audio-player.open .player-content {
        opacity: 1;
        pointer-events: auto;
    }

    audio { width: 100%; }

    .song-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 70px;
    }

    .song-btn {
        font-family: "Liberation Mono", monospace;
        display: flex;
        align-items: center;
        gap: 15px;
        background: rgba(183, 255, 229, 0.366);
        border: none;
        color: rgb(48, 133, 109);
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
    }

    .song-btn img {
        width: 45px;
        height: 45px;
        border-radius: 6px;
    }

    .playlist-switch button {
        background: rgba(183, 255, 227, 0.82); 
        border: none;
        color: rgb(48, 133, 109);
        font-family: "Liberation Mono", monospace;
        padding: 7px 12px;
        border-radius: 999px;
        cursor: pointer;
    }

  
    .popup-text {
        position: fixed;
        inset: 0;              
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 1000;   
        pointer-events: none;  
    }

    .popup-text.active { display: flex; }

    .popup-inner {
        max-width: 450px;
        background: rgba(0, 0, 0, 0.351);
        color: white;
        padding: 25px;
        border-radius: 16px;
        text-align: center;
    }

    @media screen and (max-width: 768px) {
       
        body { padding-top: 100px; } 
        
        .popup-inner {
            margin-top: 0 !important; 
            font-size: 14px;
        }
    }
  </style>
</head>

<body>

<header>
  <div id="header"></div>
</header>

<div id="infoText" class="popup-text active">
  <div class="popup-inner">
    Using the music player to your right, toggle it by clicking on the rainbow icon, and select between Mike and Will's 'Miwi' (past) and 'Byler' (present) dynamic to begin!
  </div>
</div>

<div class="audio-player" id="player">
  <button class="toggle" onclick="togglePlayer()">🌈</button>

  <div class="player-content">
    <p id="song-title">The Past and Present</p>
    <audio id="audio" controls></audio>

    <div class="playlist-switch">
        <button onclick="switchPlaylist('playlist1')">Miwi</button>
        <button onclick="switchPlaylist('playlist2')">Byler</button>
    </div>

    <div class="song-list" id="songList"></div>
  </div>
</div>

<script>
  fetch("./handf.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
    });
</script>

</body>
</html>
