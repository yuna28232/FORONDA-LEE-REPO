<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="../css files/styles.css">
  <link rel="icon" href="../assets2/other/favicon.ico">
 <script>
    

    function confirmReset() {
      return confirm("Are you sure you want to reset the form?");}

     function checkEmpty(field) {
    if (field.value.trim() === "") {
      field.classList.add("invalid");
    } else {
      field.classList.remove("invalid");
    } }
    
  </script>
      <style>
        

      
        body {font-family: Consolas, Hack, "Liberation Mono", monospace;
              background-color: #abecb960;
              padding :  50px;
              background-image: url(../assets2/bgs/BYLER.png);
              background-size:;
              background-repeat: no-repeat;
              background-position: center ;}

        form {font-family: Consolas, Hack, "Liberation Mono", monospace;
              background-color: #365a3e60;
              margin : 45px auto;
              padding : 40px 50px;
              width : 600px}

        fieldset {padding : 20px }
        
        legend {font-weight:bold}

        input:focus,
        textarea:focus {border: 3px solid #7695fd;
                        background-color: #fffc37;
                        outline : none}
        
        .invalid {border: 3px solid rgb(253, 117, 117);
                  background-color: #ffd6d6;}
        
    </style>
</head>

<body>
    <form method="post" action="submit"
  
      onreset="return confirmReset()">
      
    <fieldset>
        <legend>Your Theories</legend>
        <label for="name">Anonymous name :  </label>
        <input type="text" id="name" name="name" required onblur="checkEmpty(this)"><br>
        <label for="why">Tell us about your Theories! </label><br>
        <textarea id="why" name="why" rows="5 " cols="67" required  onblur="checkEmpty(this)">
        </textarea>
    </fieldset>
  
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  
    </form>
<footer>

</body> 
</html>
