<script>
function checkEmpty(field) {
  if (field.value.trim() === "") {
    field.classList.add("invalid");
  } else {
    field.classList.remove("invalid");
  }
}

function confirmReset() {
  return confirm("Are you sure you want to reset your work?");
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('theory');

  form.addEventListener('submit', function(event) {
    event.preventDefault(); 

    const name = document.getElementById('name').value.trim();
    const why = document.getElementById('why').value.trim();

    if (!name || !why) {
      alert("Please fill in all required fields!!!");
      return;
    }

    
    let savedData = JSON.parse(localStorage.getItem('theories')) || [];
    savedData.push({ name, why });
    localStorage.setItem('theories', JSON.stringify(savedData));

    alert(`Thank you, ${name}! Your theory has been saved to our database.`);
    form.reset();
  });
});
</script>

 <div class="form">

        id = "theory">
        
        <fieldset>
            <legend>What do YOU think really happened?</legend>
            <label for="name">Your anonymous name:  </label>
            <input type="text" id="name" name="name" required onblur="checkEmpty(this)"><br>
