<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Theories <3</title>
  
  <link rel="stylesheet" href="../css files/styles.css">
  <link rel="icon" href="../assets2/other/favicon.ico">

  <style>
    body {
      color: #d1e272;
      background-color: #000000;
      font-family: Consolas, Hack, "Liberation Mono", monospace;
      margin: 0;
      padding: 0; 
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: url(../assets2/bgs/we.gif);
      background-size: auto;
      background-repeat: repeat;
      background-position: center;
      min-height: 100vh;
    }


    .content-container {
      margin-top: 120px; 
      width: 90%;       
      max-width: 700px;
      padding: 20px;
      box-sizing: border-box; 
    }

    h1 {
      text-align: center;
      color: #7a92e7;
      text-shadow: 0 0 10px rgba(157, 175, 226, 0.5);
      font-size: 2.5rem;
    }

    h2 {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 40px;
      opacity: 0.8;
      line-height: 1.4;
    }

    #show-theories {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .theory-card {
      background: rgba(87, 11, 131, 0.05);
      border: 2px solid #5241ea;
      box-shadow: 0 4px 15px rgba(255, 163, 163, 0.5);
      padding: 20px;
      border-radius: 12px;
      transition: transform 0.2s;
      word-wrap: break-word; 
    }

    .theory-header {
      font-weight: bold;
      color: #aeafeb;
      margin-bottom: 10px;
      display: block;
      font-size: 1.5rem;
    }

    .theory-text {
      line-height: 1.5;
      margin-bottom: 15px;
      display: block;
      color: #fff; 
    }

    .btn-container {
      display: flex;
      justify-content: flex-end;
    }

    .delete-btn {
      background: none;
      border: 1px solid #ff4b2b;
      color: #ff4b2b;
      padding: 8px 16px; 
      cursor: pointer;
      font-family: inherit;
      border-radius: 4px;
      transition: all 0.3s;
    }

   
    @media screen and (max-width: 600px) {
      .content-container {
        margin-top: 100px; 
        padding: 15px;
      }

      h1 {
        font-size: 1.8rem; 
      }

      h2 {
        font-size: 0.9rem;
        margin-bottom: 25px;
      }

      .theory-card {
        padding: 15px;
      }

      .theory-header {
        font-size: 1.2rem;
      }

      .delete-btn {
        width: 100%; 
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header>
  <div id="header"></div>
  <script>
    fetch("./handf.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });
  </script>
</header>

<div class="content-container">
  <h1>Your Theories!</h1>
  <h2>The hall of fame for all of your biggest imaginations :)</h2>

  <div id="show-theories"></div>
</div>

<script>
  const container = document.getElementById('show-theories');

  function displayTheories() {
    const savedData = JSON.parse(localStorage.getItem('theories')) || [];
    container.innerHTML = ''; 

    if (savedData.length === 0) {
      container.innerHTML = '<p style="text-align:center; opacity:0.5;">No theories found yet...How about you make your own?</p>';
      return;
    }

    savedData.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'theory-card';

      card.innerHTML = `
        <span class="theory-header">${item.name}</span>
        <span class="theory-text">${item.why}</span>
        <div class="btn-container">
          <button class="delete-btn" onclick="deleteTheory(${index})">Delete</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  window.deleteTheory = function(index) {
    if (confirm("Are you sure you want to delete this theory?")) {
      const savedData = JSON.parse(localStorage.getItem('theories')) || [];
      savedData.splice(index, 1); 
      localStorage.setItem('theories', JSON.stringify(savedData));
      displayTheories();
    }
  };

  displayTheories();
</script>

</body>
</html>
