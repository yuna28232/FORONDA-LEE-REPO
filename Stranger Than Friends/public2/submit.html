<!DOCTYPE html>
<html>
<head>
  <title>Your Theories <3</title>
</head>
<body>
  <h1>Your Theories!</h1>
  <h2>The hall of fame for all of your biggest imaginations :)</h2>
  <div id="show-theories"></div>

  <style>
    h1{
      text-align: center;
      font-family:Consolas, Hack, "Liberation Mono", monospace ;
      color: rgb(157, 175, 226);
    }

    h2{
      font-family: 'Courier New', Courier, monospace;
    }
    body{
      color: rgb(157, 175, 226);
      background-color: rgb(36, 52, 106);
    }
    
  </style>

  <script>
    const savedData = JSON.parse(localStorage.getItem('theories')) || [];
    const container = document.getElementById('show-theories');

    savedData.forEach(item => {
      const div = document.createElement('div');
      div.innerHTML = `<strong>${item.name}:</strong> ${item.why}`;
      container.appendChild(div);
    });
  </script>
</body>
</html>
