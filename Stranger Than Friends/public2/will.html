<!DOCTYPE html>
<html lang="en">
<head>
  <title>Stranger Than Friends</title>
  <script src="../js-files/will-musicplayer.js" defer></script>
</head>

<div id="infoText" class="popup-text active">
  <div class="popup-inner">
    Using the music player to your right, toggle it and select between Will's nostalgic and modern mixtapes to begin!
  </div>
</div>


<body>

<header>
  <div id="header"></div>
</header>

<script>
  fetch("./handf.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
    });
</script>

<div class="audio-player" id="player">
  <button class="toggle" onclick="togglePlayer()">💛</button>

  <div class="player-content">
    <p id="song-title">Will's Mixtapes</p>
    <audio id="audio" controls></audio>

    <div class="playlist-switch">
<button onclick="switchPlaylist('playlist1')">Nostalgic</button>
<button onclick="switchPlaylist('playlist2')">Modern</button>
</div>

    <!-- JS WILL INSERT SONGS HERE -->
    <div class="song-list" id="songList"></div>
  </div>
</div>


</body>

<style>
    body {
      background-color: rgb(52, 27, 5);
    background-image: url(../assets2/bgs/castlebyers.png);
    background-size:cover;
    background-repeat: no-repeat;
    background-position: center ;
    }

    /* ===== PLAYER CONTAINER ===== */
    .audio-player {
      font-family: 'Courier New', Courier, monospace;
      position: fixed;
      top: 450px; 
      right: 0;
      transform: translateY(-50%);
      width: 50px;
      height: 500px;
      background: linear-gradient(
        180deg,
        rgba(255, 206, 73, 0.95),
        rgba(227, 140, 0, 0.95)
      );
      overflow: hidden;
      transition: width 0.3s ease;
      color: rgb(114, 53, 3);
      z-index: 9999;
    }

    .audio-player.open {
      width: 320px;
    }

    /* ===== TOGGLE ===== */
    .toggle {
      width: 50px;
      height: 50px;
      border: none;
      background: none;
      color: rgb(255, 255, 255);
      font-size: 22px;
      cursor: pointer;
    }

  .player-content {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 12px;
  gap: 6px;

  opacity: 0;
  pointer-events: none;

  transition: opacity 0.25s ease;
}

.audio-player.open .player-content {
  opacity: 1;
  pointer-events: auto;
}


    audio {
      width: 100%;
    }

    .song-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 70px;
    }

    .song-btn {
      font-family: "Liberation Mono", monospace;
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(234, 107, 9, 0.405);
      border: none;
      color: rgb(114, 53, 3);
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    .song-btn img {
      width: 50px;
      height: 50px;
      border-radius: 6px;
    }


    .playlist-switch button {
  background: rgba(234, 107, 9, 0.405); 
  border: none;
  color: rgb(114, 53, 3);
  font-family: "Liberation Mono", monospace;
  padding: 7px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.15s ease;
}

.popup-text {
  top: 180px;
  bottom: 180px;
  position: fixed;
  inset: 0;              
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;

  z-index: 2147483647;   
  pointer-events: none;  
}

.popup-text.active {
  display: flex;
}

.popup-text > div {
  max-width: 500px;
  background: rgba(0,0,0,0.55);
  color: white;
  padding: 20px;
  border-radius: 16px;
  line-height: 1.6;
  text-align: justify;
}




  </style>



</html>
